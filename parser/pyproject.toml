# Only tool settings live here. Dependencies are in requirements.txt.

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# E/F = the basics, I = sorted imports, B = common bugs, UP = modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
