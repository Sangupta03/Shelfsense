<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E1116" />
    <meta
      name="description"
      content="ShelfSense reads the ingredient labels of the skincare you own and flags clashes, doubles and gaps."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>ShelfSense — know what's on your shelf</title>
    <script>
      // Runs before anything is drawn: use the saved theme, otherwise follow the
      // system setting. Doing this in React instead would flash dark -> light.
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("ss-theme");
          if (saved === "light" || saved === "dark") theme = saved;
          else if (window.matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        if (theme === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#F7F8FA");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
