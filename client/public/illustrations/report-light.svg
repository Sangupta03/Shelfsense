<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 180" fill="none" role="img" aria-labelledby="t">
  <title id="t">A magnifying glass checking the lines of an ingredient label</title>
  <!-- label card -->
  <rect x="34" y="18" width="150" height="144" rx="16" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="2"/>
  <rect x="52" y="36" width="70" height="8" rx="4" fill="#8A94A3" opacity="0.6"/>
  <g fill="#D5DBE3">
    <rect x="52" y="58" width="112" height="7" rx="3.5"/>
    <rect x="52" y="74" width="96" height="7" rx="3.5"/>
    <rect x="52" y="106" width="104" height="7" rx="3.5"/>
    <rect x="52" y="138" width="70" height="7" rx="3.5"/>
  </g>
  <!-- highlighted lines -->
  <rect x="52" y="90" width="88" height="7" rx="3.5" fill="#D0564E"/>
  <rect x="52" y="122" width="80" height="7" rx="3.5" fill="#C9713F"/>

  <!-- magnifier -->
  <circle cx="172" cy="96" r="36" fill="#6B70D6" fill-opacity="0.10" stroke="#6B70D6" stroke-width="5"/>
  <path d="M198 122l30 30" stroke="#6B70D6" stroke-width="10" stroke-linecap="round"/>
  <path d="M152 78a24 24 0 0 1 18-8" stroke="#8A94A3" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
</svg>
