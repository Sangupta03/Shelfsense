name: CI

on:
  push:
  pull_request:

jobs:
  node:
    name: Client + server (typecheck, tests, build)
    runs-on: ubuntu-latest

    # a throwaway Postgres just for this run - no real data ever touches CI
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shelfsense
          POSTGRES_PASSWORD: shelfsense
          POSTGRES_DB: shelfsense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shelfsense"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://shelfsense:shelfsense@localhost:5432/shelfsense_test
      NODE_ENV: test
      PARSER_TOKEN: ci-parser-token
      GEMINI_API_KEY: ci-fake-key-never-called

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: parser/requirements-dev.txt

      - name: Install node packages
        run: npm ci # exactly what's in package-lock.json

      - name: Create the tables
        run: npm run db:deploy

      - name: Load the seed data
        working-directory: parser
        run: |
          pip install -r requirements-dev.txt
          python scripts/seed.py

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  python:
    name: Parser (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parser

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: parser/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # the Gemini call is mocked in every test, so no API key is needed here
      - name: Tests
        run: pytest
